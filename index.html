<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #0071e3;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card-bg: #2c2c2e;
      --text: #f5f5f7;
      --muted: #9a9a9e;
      --border: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 16px;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #item-input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  #item-input:focus {
    border-color: var(--accent);
  }
  #add-btn {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #add-btn:active {
    opacity: 0.8;
  }
  .summary {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #clear-checked {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
  }
  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child {
    border-bottom: none;
  }
  li .checkbox {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 13px;
    user-select: none;
  }
  li.checked .checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }
  li .label {
    flex: 1;
    font-size: 16px;
    word-break: break-word;
    cursor: pointer;
  }
  li.checked .label {
    text-decoration: line-through;
    color: var(--muted);
  }
  li .delete-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    flex-shrink: 0;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>
  <div class="input-row">
    <input type="text" id="item-input" placeholder="아이템 입력 후 Enter" maxlength="100" autocomplete="off">
    <button id="add-btn">추가</button>
  </div>
  <div class="summary">
    <span id="count-text">0개 항목</span>
    <button id="clear-checked">체크된 항목 삭제</button>
  </div>
  <ul id="list"></ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://jeclcortkfzhjsfciqry.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_QVA5NsKEH2V-orw68sTjiQ_Z2Hw-Etc';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const input = document.getElementById('item-input');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('list');
  const countText = document.getElementById('count-text');
  const clearCheckedBtn = document.getElementById('clear-checked');

  let items = [];

  async function loadItems() {
    const { data, error } = await db
      .from('shopping_items')
      .select('*')
      .order('created_at', { ascending: true });
    if (error) {
      console.error('Failed to load items:', error);
      return;
    }
    items = data;
    render();
  }

  function render() {
    list.innerHTML = '';

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = '리스트가 비어있어요. 아이템을 추가해보세요!';
      list.appendChild(empty);
    } else {
      items.forEach((item) => {
        const li = document.createElement('li');
        li.className = item.checked ? 'checked' : '';

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox';
        checkbox.textContent = item.checked ? '✓' : '';
        checkbox.addEventListener('click', () => toggleItem(item.id));

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.text;
        label.addEventListener('click', () => toggleItem(item.id));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.setAttribute('aria-label', '삭제');
        deleteBtn.addEventListener('click', () => deleteItem(item.id));

        li.appendChild(checkbox);
        li.appendChild(label);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    const checkedCount = items.filter((i) => i.checked).length;
    countText.textContent = `${items.length}개 항목 (${checkedCount}개 완료)`;
  }

  async function addItem() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const { data, error } = await db
      .from('shopping_items')
      .insert({ text, checked: false })
      .select()
      .single();
    if (error) {
      console.error('Failed to add item:', error);
      return;
    }
    items.push(data);
    render();
    input.focus();
  }

  async function toggleItem(id) {
    const item = items.find((i) => i.id === id);
    if (!item) return;
    const checked = !item.checked;
    const { error } = await db
      .from('shopping_items')
      .update({ checked })
      .eq('id', id);
    if (error) {
      console.error('Failed to update item:', error);
      return;
    }
    item.checked = checked;
    render();
  }

  async function deleteItem(id) {
    const { error } = await db.from('shopping_items').delete().eq('id', id);
    if (error) {
      console.error('Failed to delete item:', error);
      return;
    }
    items = items.filter((i) => i.id !== id);
    render();
  }

  async function clearChecked() {
    const { error } = await db.from('shopping_items').delete().eq('checked', true);
    if (error) {
      console.error('Failed to clear checked items:', error);
      return;
    }
    items = items.filter((i) => !i.checked);
    render();
  }

  addBtn.addEventListener('click', addItem);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addItem();
  });
  clearCheckedBtn.addEventListener('click', clearChecked);

  loadItems();
})();
</script>
</body>
</html>
